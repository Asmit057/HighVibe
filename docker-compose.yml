# HighVibe infrastructure for local development.
#
#   docker compose up -d                 # PostgreSQL, Kafka, Redis, MinIO
#   docker compose --profile apps up -d  # ...plus every HighVibe service in containers
#
# For day-to-day development run the infrastructure here and the services with
# scripts/start-services.ps1. For a server, add docker-compose.prod.yml (see docs/DEPLOYMENT.md).

name: highvibe

# environment shared by every HighVibe service
x-service-env: &service-env
  EUREKA_URL: http://discovery-service:8761/eureka
  EUREKA_PREFER_IP: "true"
  CONFIG_SERVER_URL: http://config-service:8888
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-highvibe-local-dev-secret-change-me-0123456789abcdef}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/account_db
  WORKSPACE_DB_URL: jdbc:postgresql://postgres:5432/workspace_db
  INTELLIGENCE_DB_URL: jdbc:postgresql://postgres:5432/intelligence_db
  DB_PASSWORD: ${DB_PASSWORD:-highvibe}
  REDIS_HOST: redis
  MINIO_URL: http://minio:9000
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-highvibe-secret}
  AI_PROVIDER: ${AI_PROVIDER:-auto}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  # "-" (not ":-"): an empty value in .env turns fallback off
  GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS-gemini-3.1-flash-lite}
  GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-4}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: highvibe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-highvibe}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highvibe"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    # the official minio/minio image is no longer published on Docker Hub
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: highvibe
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-highvibe-secret}
    ports:
      - "9000:9000"   # S3 API (this image has no web console)
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      retries: 20

  # ------------------------------------------------------------------ services (profile "apps")
  discovery-service:
    profiles: ["apps"]
    build: { context: ./backend, dockerfile: Dockerfile, args: { MODULE: discovery-service } }
    ports: ["8761:8761"]
    environment:
      EUREKA_HOSTNAME: discovery-service

  config-service:
    profiles: ["apps"]
    build: { context: ./backend, dockerfile: Dockerfile, args: { MODULE: config-service } }
    ports: ["8888:8888"]
    environment: *service-env
    depends_on: [discovery-service]

  account-service:
    profiles: ["apps"]
    build: { context: ./backend, dockerfile: Dockerfile, args: { MODULE: account-service } }
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }
      config-service: { condition: service_started }

  workspace-service:
    profiles: ["apps"]
    build: { context: ./backend, dockerfile: Dockerfile, args: { MODULE: workspace-service, WITH_NODE: "true" } }
    environment:
      <<: *service-env
      # live previews run inside this container on the published port range below
      PREVIEW_HOST: 0.0.0.0
      PREVIEW_PUBLIC_HOST: ${PREVIEW_PUBLIC_HOST:-}
      PREVIEW_PORT_START: "5200"
      PREVIEW_PORT_END: "5210"
    ports: ["5200-5210:5200-5210"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
      config-service: { condition: service_started }

  intelligence-service:
    profiles: ["apps"]
    build: { context: ./backend, dockerfile: Dockerfile, args: { MODULE: intelligence-service } }
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-service: { condition: service_started }

  api-gateway:
    profiles: ["apps"]
    build: { context: ./backend, dockerfile: Dockerfile, args: { MODULE: api-gateway } }
    environment: *service-env
    ports: ["8080:8080"]
    depends_on: [config-service]

  frontend:
    profiles: ["apps"]
    build: { context: ./frontend }
    ports: ["5173:80"]
    depends_on: [api-gateway]

volumes:
  postgres-data:
  minio-data:
