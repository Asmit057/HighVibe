server:
  port: ${PORT:9030}

spring:
  datasource:
    url: ${INTELLIGENCE_DB_URL:jdbc:postgresql://localhost:5432/intelligence_db?connectTimeout=30&socketTimeout=0}
    username: ${DB_USERNAME:highvibe}
    password: ${DB_PASSWORD:highvibe}
  kafka:
    consumer:
      group-id: intelligence-group
  mvc:
    async:
      # generations stream for minutes; the SSE emitter enforces its own timeout
      request-timeout: -1

app:
  ai:
    # gemini | demo | auto (auto = Gemini when a Gemini key is set, otherwise the offline demo)
    provider: ${AI_PROVIDER:auto}
    history-messages: ${AI_HISTORY_MESSAGES:12}
    gemini:
      # free key: https://aistudio.google.com/apikey
      api-key: ${GEMINI_API_KEY:}
      # more keys, comma-separated: used in turn, and in place of a key that is rate-limited or rejected
      api-keys: ${GEMINI_API_KEYS:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      # used in order while the model above is overloaded or missing; it is tried again after a rest
      # (set GEMINI_FALLBACK_MODELS to an empty value to turn fallback off)
      fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:32768}
      # calls per generation before giving up, across keys and models
      max-attempts: ${GEMINI_MAX_ATTEMPTS:4}
