server:
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            # AI generations stream over SSE for several minutes
            response-timeout: 15m
          routes:
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/auth/**,/api/billing/**
            - id: workspace-service
              uri: lb://workspace-service
              predicates:
                - Path=/api/projects/**,/api/invitations/**
            - id: intelligence-service
              uri: lb://intelligence-service
              predicates:
                - Path=/api/chat/**,/api/usage/**

app:
  security:
    public-routes:
      - /api/auth/signup
      - /api/auth/login
      - /api/auth/refresh
      - /api/billing/plans
      - /api/billing/webhook
      - /actuator/health
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
